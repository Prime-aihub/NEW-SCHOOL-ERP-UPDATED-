<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Exams | Maiamma School Hub</title>

    <link rel="stylesheet"
          href="student-exams.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../global-mobile-fix.css">

</head>

<body>

    <!-- ==========================
         TOP BAR
    =========================== -->

    <header class="topbar">

        <a href="../student-dashboard.html"
           class="back-btn">

            <i class="fas fa-arrow-left"></i>

            Dashboard

        </a>

        <h2>

            <i class="fas fa-file-signature"></i>

            Student Exams

        </h2>

        <button id="themeToggle"
                class="theme-toggle">

            <i class="fas fa-moon"></i>

        </button>

    </header>

    <!-- ==========================
         HERO
    =========================== -->

    <section class="hero">

        <img src="images/hero-exam.jpg"
             alt="Student Exams">

        <div class="hero-overlay">

            <h1>

                Upcoming Exams

            </h1>

            <p>

                Stay prepared for your upcoming examinations.
                Check dates, timings, syllabus and exam type
                published by your teachers.

            </p>

        </div>

    </section>

    <!-- ==========================
         SUMMARY
    =========================== -->

    <section class="summary">

        <div class="summary-card">

            <i class="fas fa-book-open"></i>

            <h3 id="totalExams">

                0

            </h3>

            <span>

                Total Exams

            </span>

        </div>

        <div class="summary-card">

            <i class="fas fa-calendar-day"></i>

            <h3 id="todayExams">

                0

            </h3>

            <span>

                Today's Exams

            </span>

        </div>

        <div class="summary-card">

            <i class="fas fa-hourglass-half"></i>

            <h3 id="upcomingExams">

                0

            </h3>

            <span>

                Upcoming Exams

            </span>

        </div>

    </section>

    <!-- ==========================
         SEARCH
    =========================== -->

    <section class="search-section">

        <div class="search-box">

            <i class="fas fa-search"></i>

            <input
                type="text"
                id="searchExam"
                placeholder="Search subject or exam...">

        </div>

    </section>

    <!-- ==========================
         LOADING
    =========================== -->

    <div id="loading"
         class="loading">

        <div class="spinner"></div>

        <p>

            Loading Exams...

        </p>

    </div>

    <!-- ==========================
         EMPTY STATE
    =========================== -->

    <div id="emptyState"
         class="empty-state"
         style="display:none;">

        <i class="fas fa-calendar-xmark"></i>

        <h2>

            No Exams Scheduled

        </h2>

        <p>

            Your teachers haven't published any exams yet.

        </p>

    </div>

    <!-- ==========================
         EXAMS CONTAINER
    =========================== -->

    <main id="examContainer"
          class="exam-container">

        <!-- Firebase Exam Cards -->

    </main>

    <!-- ==========================
         FLOATING REMINDER
    =========================== -->

    <button class="floating-btn"
            title="Upcoming Exams">

        <i class="fas fa-bell"></i>

    </button>

    <!-- ==========================
         SCRIPT
    =========================== -->

    <script type="module"
            src="student-exams.js"></script>

</body>

</html>
