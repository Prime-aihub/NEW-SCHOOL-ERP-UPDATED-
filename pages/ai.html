<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeAiHub AI</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <link rel="stylesheet" href="ai.css">
</head>
<body>
    <body data-role="student" data-storage="primeai-student-chat">
    
<div id="loadingScreen">
    <video autoplay muted playsinline>
        <source src="media/frank.mp4" type="video/mp4">
    </video>
</div>

    
    <div class="background-glow"></div>

    <div class="ai-container">
        <header class="ai-header">
          <button class="back-btn" type="button"
        aria-label="Go back"
        onclick="window.location.href='../student-menu.html'">
    <i class="fa-solid fa-arrow-left"></i>
</button>
            <div>
                <h2>Meet Frank</h2>
<p>Your Personal AI Tutor</p>
            </div>
            <div class="header-actions">
    <button id="newChatBtn" class="menu-btn" type="button" aria-label="New Chat">
        <i class="fa-solid fa-pen-to-square"></i>
    </button>

    <button class="menu-btn" type="button" aria-label="Open menu">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </button>
</div>
        </header>

     
          <h1>Hello 👋</h1>
<p>I'm Frank, your personal AI tutor. Ask me anything.</p>
        </section>

        <section id="chatArea" class="chat-area" aria-live="polite">
            <div class="message ai">
                <div class="avatar">🤖</div>
                <div class="bubble">Hello! What would you like to learn today?</div>
            </div>
        </section>

        <div id="typing" class="typing" aria-label="AI is typing" aria-hidden="true"><span></span><span></span><span></span></div>

        <footer class="chat-footer">
            <div class="chat-box">
                <button id="attachBtn" class="icon-btn" type="button" aria-label="Attach a file"><i class="fa-solid fa-plus"></i></button>
                <input id="messageInput" type="text" placeholder="Ask anything..." autocomplete="off">
                <button id="voiceBtn" class="icon-btn" type="button" aria-label="Use voice input"><i class="fa-solid fa-microphone"></i></button>
                <button id="sendBtn" class="send-btn" type="button" aria-label="Send message"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </footer>
    </div>

    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.webp" hidden>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="ai.js"></script>
</body>
</html>
